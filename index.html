<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaiMRE</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #ddd; font-family: sans-serif; }
  #screen {
    position: absolute; left: 0; top: 0; image-rendering: pixelated; background: #000;
  }
  #status {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px;
    font-size: 14px; text-align: center; background: rgba(0, 0, 0, 0.75); display: none; white-space: pre-wrap;
  }
  #status.show { display: block; }
  #menu {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; color: #ddd;
    padding: 10px; box-sizing: border-box; display: none; overflow: hidden;
  }
  #menu.show { display: block; }
  #menu h1 { font-size: 18px; margin: 4px 0 10px; color: #fff; text-align: center; }
  #menu ul { list-style: none; margin: 0; padding: 0; }
  #menu li { padding: 10px 6px; font-size: 16px; border-bottom: 1px solid #222; }
  #menu li.sel { background: #2a5bd7; color: #fff; }
  #pickFile { display: none; }
  #scanner {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; color: #ddd;
    display: none; overflow: hidden;
  }
  #scanner.show { display: block; }
  #scanHeader {
    position: absolute; left: 0; top: 0; right: 0; height: 28px; padding: 4px 8px; box-sizing: border-box;
    font-size: 14px; color: #fff; background: #2a5bd7; white-space: nowrap; overflow: hidden;
  }
  #scanFoot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22px; padding: 2px 8px; box-sizing: border-box;
    font-size: 12px; color: #aaa; background: #111; white-space: nowrap; overflow: hidden;
  }
  #scanList {
    list-style: none; margin: 0; padding: 0; position: absolute;
    top: 28px; bottom: 22px; left: 0; right: 0; overflow-y: auto;
  }
  #scanList li { padding: 6px 8px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid #222; }
  #scanList li.sel { background: #2a5bd7; color: #fff; }
  #status.err { color: #ff8080; }
</style>
</head>
<body>
<canvas id="screen" width="240" height="320"></canvas>
<div id="status"></div>
<div id="menu">
  <h1>KaiMRE</h1>
  <ul id="menuList"></ul>
</div>
<div id="scanner">
  <div id="scanHeader">Scanning...</div>
  <ul id="scanList"></ul>
  <div id="scanFoot">Up/Down: move  OK: play  Back: menu</div>
</div>
<input type="file" id="pickFile" accept=".vxp">
<script>
(function () {
  "use strict";

  // ---------- helpers ----------
  var statusBox = document.getElementById("status");
  function showStatus(text, isError) {
    statusBox.className = (isError ? "err" : "") + (text ? " show" : "");
    statusBox.textContent = text || "";
  }
  function errText(e) {
    if (!e) return "unknown";
    return e.message || String(e);
  }
  function getParam(name) {
    var q = (location.search || "").replace(/^\?/, "");
    var parts = q.split("&");
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (decodeURIComponent(kv[0]) === name) {
        return kv.length > 1 ? decodeURIComponent(kv.slice(1).join("=")) : "";
      }
    }
    return null;
  }
  // loop=1 in the address bar turns looping on. Default: play every sound once.
  var allowLoop = getParam("loop") === "1";
  // ?charset=gbk keeps the old Chinese text decoding; default is UTF-8 / Windows-1251.
  var textCharset = getParam("charset") === "gbk" ? "gbk" : "auto";

  // ---------- screen ----------
  var canvas = document.getElementById("screen");
  var ctx2d = canvas.getContext("2d");
  // Scale the 240x320 game to the largest size that fits the window, centred.
  function fitScreen() {
    var scale = Math.min(window.innerWidth / 240, window.innerHeight / 320);
    if (!(scale > 0)) scale = 1;
    var w = Math.floor(240 * scale), h = Math.floor(320 * scale);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
    canvas.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
  }
  fitScreen();
  window.addEventListener("resize", fitScreen);
  var imageData = ctx2d.createImageData(240, 320);
  var out32 = new Uint32Array(imageData.data.buffer);
  // RGB565 -> packed RGBA lookup, built once. One 32-bit write per pixel is much
  // cheaper than four byte writes on a low-end KaiOS CPU.
  var littleEndian = new Uint8Array(new Uint16Array([1]).buffer)[0] === 1;
  var lut = new Uint32Array(65536);
  (function () {
    for (var v = 0; v < 65536; v++) {
      var lr = (v >> 11) & 31, lg = (v >> 5) & 63, lb = v & 31;
      var R = (lr << 3) | (lr >> 2), G = (lg << 2) | (lg >> 4), B = (lb << 3) | (lb >> 2);
      lut[v] = littleEndian ? ((255 << 24) | (B << 16) | (G << 8) | R) >>> 0
                            : ((R << 24) | (G << 16) | (B << 8) | 255) >>> 0;
    }
  })();

  function drawFrame(px) {
    var n = Math.min(px.length, out32.length);
    for (var i = 0; i < n; i++) out32[i] = lut[px[i] & 0xFFFF];
    ctx2d.putImageData(imageData, 0, 0);
  }

  // ---------- MIDI parser (SMF type 0 and 1) ----------
  function parseMidi(d) {
    function str4(o) { return String.fromCharCode(d[o], d[o + 1], d[o + 2], d[o + 3]); }
    function u32(o) { return ((d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3]) >>> 0; }
    function u16(o) { return (d[o] << 8) | d[o + 1]; }
    if (d.length < 14 || str4(0) !== "MThd") return null;
    var hdrLen = u32(4), ntrk = u16(10), div = u16(12);
    var ppq = (div & 0x8000) ? 480 : div;
    if (!ppq) ppq = 480;
    var raw = [];
    var p = 8 + hdrLen, tracks = 0;
    while (p + 8 <= d.length && tracks < ntrk) {
      var id = str4(p), len = u32(p + 4);
      p += 8;
      var end = Math.min(d.length, p + len);
      if (id !== "MTrk") { p = end; continue; }
      tracks++;
      var q = p, tick = 0, running = 0;
      while (q < end) {
        // variable-length delta time
        var v = 0, b;
        do { b = d[q++]; v = v * 128 + (b & 127); } while ((b & 128) && q < end);
        tick += v;
        var st = d[q];
        if (st & 0x80) { running = st; q++; } else { st = running; }
        if (st === 0xFF) {
          var type = d[q++];
          var l = 0;
          do { b = d[q++]; l = l * 128 + (b & 127); } while ((b & 128) && q < end);
          if (type === 0x51 && l === 3) {
            raw.push({ tick: tick, kind: "tempo", us: (d[q] << 16) | (d[q + 1] << 8) | d[q + 2] });
          }
          if (type === 0x2F) { q = end; break; }
          q += l;
        } else if (st === 0xF0 || st === 0xF7) {
          var l2 = 0;
          do { b = d[q++]; l2 = l2 * 128 + (b & 127); } while ((b & 128) && q < end);
          q += l2;
        } else {
          var hi = st & 0xF0, ch = st & 0x0F;
          if (hi === 0xC0) {
            raw.push({ tick: tick, kind: "prog", ch: ch, val: d[q++] });
          } else if (hi === 0xD0) {
            q++;
          } else {
            var n1 = d[q++], n2 = d[q++];
            if (hi === 0x90 && n2 > 0) raw.push({ tick: tick, kind: "on", ch: ch, note: n1, vel: n2 });
            else if (hi === 0x80 || hi === 0x90) raw.push({ tick: tick, kind: "off", ch: ch, note: n1 });
            else if (hi === 0xB0) raw.push({ tick: tick, kind: "cc", ch: ch, cc: n1, val: n2 });
            else if (hi === 0xE0) raw.push({ tick: tick, kind: "bend", ch: ch, val: ((n2 << 7) | n1) - 8192 });
          }
        }
      }
      p = end;
    }
    // stable sort by tick
    for (var k = 0; k < raw.length; k++) raw[k].order = k;
    raw.sort(function (a, b2) { return (a.tick - b2.tick) || (a.order - b2.order); });
    // convert ticks to seconds using tempo changes
    var tempo = 500000, t = 0, last = 0, events = [];
    for (var j = 0; j < raw.length; j++) {
      var r = raw[j];
      t += (r.tick - last) * tempo / (ppq * 1000000);
      last = r.tick;
      if (r.kind === "tempo") { tempo = r.us; continue; }
      r.t = t;
      events.push(r);
    }
    return { events: events, duration: t };
  }

  // ---------- MIDI synth (approximation, not GM samples) ----------
  // Per instrument family: waveform and envelope.
  var FAMILIES = [
    { from: 0,  to: 15,  wave: "triangle", a: 0.005, d: 0.30, s: 0.35, r: 0.08 }, // piano, chromatic perc
    { from: 16, to: 23,  wave: "square",   a: 0.01,  d: 0.05, s: 0.80, r: 0.05 }, // organ
    { from: 24, to: 31,  wave: "triangle", a: 0.005, d: 0.50, s: 0.20, r: 0.12 }, // guitar
    { from: 32, to: 39,  wave: "square",   a: 0.005, d: 0.20, s: 0.60, r: 0.06 }, // bass
    { from: 40, to: 47,  wave: "sawtooth", a: 0.12,  d: 0.20, s: 0.70, r: 0.25 }, // strings
    { from: 48, to: 55,  wave: "sawtooth", a: 0.15,  d: 0.20, s: 0.70, r: 0.30 }, // ensemble
    { from: 56, to: 63,  wave: "sawtooth", a: 0.06,  d: 0.15, s: 0.75, r: 0.12 }, // brass
    { from: 64, to: 71,  wave: "square",   a: 0.04,  d: 0.10, s: 0.70, r: 0.10 }, // reed
    { from: 72, to: 79,  wave: "sine",     a: 0.05,  d: 0.10, s: 0.80, r: 0.15 }, // pipe
    { from: 80, to: 87,  wave: "square",   a: 0.01,  d: 0.05, s: 0.80, r: 0.10 }, // synth lead
    { from: 88, to: 95,  wave: "sawtooth", a: 0.30,  d: 0.30, s: 0.60, r: 0.50 }, // synth pad
    { from: 96, to: 127, wave: "triangle", a: 0.02,  d: 0.20, s: 0.50, r: 0.20 }  // fx / other
  ];
  function familyFor(prog) {
    for (var i = 0; i < FAMILIES.length; i++) {
      if (prog >= FAMILIES[i].from && prog <= FAMILIES[i].to) return FAMILIES[i];
    }
    return FAMILIES[0];
  }

  function Synth() {
    this.ctx = null;
    this.noise = null;
    this.master = null;
    this.voices = [];
    this.ch = [];
    for (var i = 0; i < 16; i++) {
      this.ch.push({ prog: 0, vol: 100, expr: 127, bend: 0, sustain: false });
    }
  }
  Synth.prototype.ensure = function () {
    if (this.ctx) return this.ctx;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { this.ctx = new C(); } catch (e) { this.ctx = null; }
    if (this.ctx && this.ctx.createGain) {
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx && this.ctx.createBuffer) {
      var len = this.ctx.sampleRate;
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    return this.ctx;
  };
  Synth.prototype.stopVoice = function (v) {
    try { v.src.stop(); } catch (e) {}
  };
  Synth.prototype.busy = function () {
    return this.voices.length >= 48;
  };
  Synth.prototype.addVoice = function (v) {
    this.voices.push(v);
  };
  Synth.prototype.cleanup = function (now) {
    var keep = [];
    for (var i = 0; i < this.voices.length; i++) {
      if (this.voices[i].end > now) keep.push(this.voices[i]);
    }
    this.voices = keep;
  };
  Synth.prototype.noteOn = function (ev, when, dur) {
    var c = this.ensure();
    if (!c || this.busy()) return;
    var st = this.ch[ev.ch];
    var vel = ev.vel / 127;
    var level = vel * (st.vol / 127) * (st.expr / 127);
    if (ev.ch === 9) { this.drum(ev.note, when, level * 0.5); return; }
    var fam = familyFor(st.prog);
    var freq = 440 * Math.pow(2, (ev.note - 69 + st.bend) / 12);
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = fam.wave;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(this.master || c.destination);
    var peak = level * 0.22;
    var end = when + dur + fam.r;
    var atkEnd = when + Math.min(fam.a, dur);
    var decEnd = when + Math.min(fam.a + fam.d, dur);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(peak, atkEnd);
    gain.gain.linearRampToValueAtTime(Math.max(peak * fam.s, 0.0001), decEnd);
    gain.gain.setValueAtTime(Math.max(peak * fam.s, 0.0001), when + dur);
    gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.start(when);
    osc.stop(end + 0.02);
    this.addVoice({ src: osc, end: end + 0.02 });
  };
  Synth.prototype.drum = function (note, when, level) {
    var c = this.ctx;
    var gain = c.createGain();
    gain.connect(this.master || c.destination);
    var len = 0.2;
    var src, filt;
    if (note === 35 || note === 36) {
      // kick: sine with pitch drop
      var k = c.createOscillator();
      k.type = "sine";
      k.frequency.setValueAtTime(150, when);
      k.frequency.exponentialRampToValueAtTime(45, when + 0.12);
      k.connect(gain);
      gain.gain.setValueAtTime(level * 0.9, when);
      gain.gain.exponentialRampToValueAtTime(0.001, when + 0.25);
      k.start(when); k.stop(when + 0.26);
      this.addVoice({ src: k, end: when + 0.27 });
      return;
    }
    if (!this.noise) return;
    src = c.createBufferSource();
    src.buffer = this.noise;
    filt = c.createBiquadFilter();
    if (note === 38 || note === 40) { filt.type = "highpass"; filt.frequency.value = 1200; len = 0.18; }
    else if (note === 42 || note === 44) { filt.type = "highpass"; filt.frequency.value = 7000; len = 0.05; }
    else if (note === 46) { filt.type = "highpass"; filt.frequency.value = 7000; len = 0.25; }
    else if (note >= 49 && note <= 59) { filt.type = "highpass"; filt.frequency.value = 5000; len = 0.7; }
    else if (note >= 41 && note <= 50) { filt.type = "lowpass"; filt.frequency.value = 900; len = 0.25; }
    else { filt.type = "highpass"; filt.frequency.value = 2000; len = 0.1; }
    src.connect(filt);
    filt.connect(gain);
    gain.gain.setValueAtTime(level, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + len);
    src.start(when, Math.random() * 0.5);
    src.stop(when + len + 0.02);
    this.addVoice({ src: src, end: when + len + 0.02 });
  };
  Synth.prototype.silence = function () {
    for (var i = 0; i < this.voices.length; i++) this.stopVoice(this.voices[i]);
    this.voices = [];
  };

  // Player: schedules events a little ahead of the audio clock.
  function MidiPlayer(synth) {
    this.synth = synth;
    this.events = [];
    this.duration = 0;
    this.idx = 0;
    this.shift = 0;
    this.startAt = 0;
    this.timer = null;
    this.playing = false;
    this.loop = false;
  }
  MidiPlayer.prototype.prepare = function (parsed) {
    var ev = parsed.events;
    var open = {}, sustain = {}, held = {}, i, e, key;
    function close(on, t) {
      on.dur = Math.max(0.03, Math.min(t - on.t, 8));
    }
    for (i = 0; i < ev.length; i++) {
      e = ev[i];
      if (e.kind === "on") {
        key = e.ch * 128 + e.note;
        if (open[key]) close(open[key], e.t);
        open[key] = e;
        e.dur = 1;
      } else if (e.kind === "off") {
        key = e.ch * 128 + e.note;
        if (sustain[e.ch]) {
          (held[e.ch] = held[e.ch] || []).push(key);
        } else if (open[key]) {
          close(open[key], e.t);
          delete open[key];
        }
      } else if (e.kind === "cc" && e.cc === 64) {
        sustain[e.ch] = e.val >= 64;
        if (!sustain[e.ch] && held[e.ch]) {
          for (var h = 0; h < held[e.ch].length; h++) {
            var k2 = held[e.ch][h];
            if (open[k2]) { close(open[k2], e.t); delete open[k2]; }
          }
          held[e.ch] = [];
        }
      }
    }
    for (key in open) { if (open.hasOwnProperty(key)) close(open[key], open[key].t + 1); }
    this.events = ev;
    this.duration = Math.max(parsed.duration, ev.length ? ev[ev.length - 1].t + 1 : 0);
  };
  MidiPlayer.prototype.play = function (bytes, loopFlag) {
    var parsed = parseMidi(new Uint8Array(bytes));
    if (!parsed) return;
    this.stop();
    this.prepare(parsed);
    if (!this.events.length) return;
    this.loop = allowLoop && !!loopFlag;
    this.synth.ensure();
    if (!this.synth.ctx) return;
    this.resetChannels();
    this.idx = 0;
    this.shift = 0;
    this.startAt = this.synth.ctx.currentTime + 0.1;
    this.playing = true;
    var self = this;
    this.schedule();
    this.timer = setInterval(function () { self.schedule(); }, 100);
  };
  MidiPlayer.prototype.resetChannels = function () {
    for (var i = 0; i < 16; i++) {
      var st = this.synth.ch[i];
      st.prog = 0; st.vol = 100; st.expr = 127; st.bend = 0; st.sustain = false;
    }
  };
  MidiPlayer.prototype.apply = function (e, when) {
    var st = this.synth.ch[e.ch];
    if (e.kind === "prog") st.prog = e.val;
    else if (e.kind === "bend") st.bend = (e.val / 8192) * 2;
    else if (e.kind === "cc") {
      if (e.cc === 7) st.vol = e.val;
      else if (e.cc === 11) st.expr = e.val;
      else if (e.cc === 64) st.sustain = e.val >= 64;
      else if (e.cc === 120 || e.cc === 123) this.synth.silence();
    }
  };
  MidiPlayer.prototype.schedule = function () {
    var c = this.synth.ctx;
    if (!c || !this.playing) return;
    var horizon = c.currentTime + 3.0;
    var guard = 0;
    while (guard++ < 5000) {
      if (this.idx >= this.events.length) {
        if (!this.loop) break;
        this.shift += this.duration;
        this.idx = 0;
        this.resetChannels();
      }
      var e = this.events[this.idx];
      var when = this.startAt + this.shift + e.t;
      if (when > horizon) break;
      if (e.kind === "on") {
        if (when >= c.currentTime - 0.5) this.synth.noteOn(e, Math.max(when, c.currentTime), e.dur);
      } else {
        this.apply(e, when);
      }
      this.idx++;
    }
    this.synth.cleanup(c.currentTime);
    if (!this.loop && this.idx >= this.events.length && c.currentTime > this.startAt + this.duration + 1) {
      this.stop();
    }
  };
  MidiPlayer.prototype.stop = function () {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.synth.silence();
    this.events = [];
  };
  MidiPlayer.prototype.pause = function () {
    if (this.synth.ctx && this.synth.ctx.suspend) this.synth.ctx.suspend();
  };
  MidiPlayer.prototype.resume = function () {
    if (this.synth.ctx && this.synth.ctx.resume) this.synth.ctx.resume();
  };

  // ---------- sampled audio (WAV, MP3, OGG, ...) via <audio> ----------
  var audioEl = null, audioUrl = null;
  function sniffMime(b) {
    if (b.length >= 4 && b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) return "audio/wav";  // RIFF
    if (b.length >= 4 && b[0] === 0x4F && b[1] === 0x67 && b[2] === 0x67 && b[3] === 0x53) return "audio/ogg";  // OggS
    if (b.length >= 3 && b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) return "audio/mpeg";                 // ID3
    if (b.length >= 2 && b[0] === 0xFF && (b[1] & 0xE0) === 0xE0) return "audio/mpeg";                         // MP3 frame
    if (b.length >= 5 && b[0] === 0x23 && b[1] === 0x21 && b[2] === 0x41 && b[3] === 0x4D && b[4] === 0x52) return "audio/amr"; // #!AMR
    if (b.length >= 4 && b[0] === 0x66 && b[1] === 0x4C && b[2] === 0x61 && b[3] === 0x43) return "audio/flac"; // fLaC
    return "audio/mpeg";
  }
  function stopSampled() {
    if (audioEl) {
      try { audioEl.pause(); } catch (e) {}
      audioEl = null;
    }
    if (audioUrl) {
      try { URL.revokeObjectURL(audioUrl); } catch (e) {}
      audioUrl = null;
    }
  }
  function playSampled(bytes, loopFlag) {
    stopSampled();
    var b = new Uint8Array(bytes);
    var mime = sniffMime(b);
    var canPlay = (new Audio()).canPlayType ? (new Audio()).canPlayType(mime) : "";
    if (!canPlay) {
      showStatus("This device cannot play " + mime + " sound.", true);
      return;
    }
    var blob = new Blob([b], { type: mime });
    audioUrl = URL.createObjectURL(blob);
    audioEl = new Audio(audioUrl);
    audioEl.loop = allowLoop && !!loopFlag;
    var p = audioEl.play();
    if (p && p.catch) p.catch(function (e) { showStatus("Sound blocked: press any key, then it will play. (" + errText(e) + ")", true); });
  }

  // ---------- engine worker ----------
  var synth = new Synth();
  var midi = new MidiPlayer(synth);
  var worker = null;
  var closed = false;
  var lastFault = null;

  // Frames are coalesced: only the newest frame is drawn, once per display refresh.
  // Older frames are returned to the worker at once, so the worker never stalls.
  var pendingFrame = null;
  var frameQueued = false;
  var exitRequested = false;
  function recycleFrame(px) {
    if (worker && px) worker.postMessage({ type: "recycle", px: px }, [px.buffer]);
  }
  function onFrame(d) {
    if (d.exit) exitRequested = true;
    if (pendingFrame) recycleFrame(pendingFrame.px);
    pendingFrame = d;
    if (!frameQueued) {
      frameQueued = true;
      if (window.requestAnimationFrame) requestAnimationFrame(presentFrame);
      else setTimeout(presentFrame, 16);
    }
  }
  function presentFrame() {
    frameQueued = false;
    var d = pendingFrame;
    pendingFrame = null;
    if (d) {
      drawFrame(d.px);
      recycleFrame(d.px);
    }
    if (exitRequested) finish();
  }
  function finish(message) {
    if (closed) return;
    closed = true;
    midi.stop();
    stopSampled();
    if (worker) { try { worker.terminate(); } catch (e) {} worker = null; }
    showMenu("Game closed.");
  }
  function onWorkerMessage(e) {
    var d = e.data;
    if (d.type === "frame") { onFrame(d); return; }
    if (d.type === "boot") {
      if (d.result && d.result.ok) showStatus("", false);
      else showStatus("Game did not start: " + ((d.result && d.result.message) || "unknown error"), true);
      return;
    }
    if (d.type === "log") {
      if (d.level === "warn" || d.level === "error") showStatus(d.text, d.level === "error");
      return;
    }
    if (d.type === "midi") midi.play(d.bytes, d.loop);
    else if (d.type === "midi-stop") midi.stop();
    else if (d.type === "midi-pause") midi.pause();
    else if (d.type === "midi-resume") midi.resume();
    else if (d.type === "audio") playSampled(d.bytes, d.loop);
    else if (d.type === "audio-stop") stopSampled();
    else if (d.type === "audio-pause") { if (audioEl) audioEl.pause(); }
    else if (d.type === "audio-resume") { if (audioEl) audioEl.play(); }
  }
  function onWorkerError(e) {
    var where = (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : "");
    showStatus("Engine error: " + (e.message || "script failed to load") + where, true);
  }
  function startEngine(bytes) {
    closed = false;
    exitRequested = false;
    hideMenu();
    scanVisible = false;
    scannerBox.className = "";
    if (!window.Worker) {
      showStatus("This device cannot run the engine (Web Workers are not supported).", true);
      return;
    }
    try {
      worker = new Worker("engine.js");
    } catch (e) {
      showStatus("Cannot start engine: " + errText(e), true);
      return;
    }
    worker.onmessage = onWorkerMessage;
    worker.onerror = onWorkerError;
    try {
      worker.postMessage({ type: "load", bytes: bytes, name: "game.vxp", charset: textCharset }, [bytes]);
    } catch (e) {
      showStatus("Cannot send the game to the engine: " + errText(e), true);
    }
  }

  // ---------- menu: package game, file picker, or ?vxp=URL ----------
  var menuVisible = false;
  var menuItems = [];
  var menuIndex = 0;
  var menuBox = document.getElementById("menu");
  var menuList = document.getElementById("menuList");
  var pickInput = document.getElementById("pickFile");
  // Scanner state is declared here, before the first showMenu() call.
  var scanVisible = false;
  var scannerBox = document.getElementById("scanner");
  var scanListEl = document.getElementById("scanList");
  var scanHeaderEl = document.getElementById("scanHeader");
  var scanFiles = [];
  var scanIndex = 0;

  function renderMenu() {
    menuList.innerHTML = "";
    for (var i = 0; i < menuItems.length; i++) {
      var li = document.createElement("li");
      li.textContent = menuItems[i].label;
      if (i === menuIndex) li.className = "sel";
      menuList.appendChild(li);
    }
  }
  function showMenu(message) {
    scanVisible = false;
    scannerBox.className = "";
    menuVisible = true;
    menuBox.className = "show";
    menuItems = [
      { label: "Game from package (game.vxp)", action: loadPackageGame },
      { label: "Scan SD card for .vxp", action: scanSdcard },
      { label: "Open .vxp from phone", action: openPicker }
    ];
    if (vxpUrl) menuItems.unshift({ label: "Game from link ?vxp", action: loadLinkGame });
    menuItems.push({ label: "Exit", action: function () { showStatus("Close the app with the Back key.", false); } });
    menuIndex = 0;
    renderMenu();
    showStatus(message || "", false);
  }
  function hideMenu() {
    menuVisible = false;
    menuBox.className = "";
  }
  function moveMenu(step) {
    menuIndex = (menuIndex + step + menuItems.length) % menuItems.length;
    renderMenu();
  }
  function activateMenu() {
    var item = menuItems[menuIndex];
    if (item && item.action) item.action();
  }

  // Only .vxp files are accepted.
  function isVxpName(name) {
    return /\.vxp$/i.test(name || "");
  }
  function loadPackageGame() {
    showStatus("Loading game...", false);
    fetch("game.vxp").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      startEngine(buf);
    }, function (e) {
      showMenu("game.vxp not found in the package (" + errText(e) + ").");
    });
  }
  function loadLinkGame() {
    showStatus("Loading game...", false);
    fetch(vxpUrl).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      startEngine(buf);
    }, function (e) {
      showMenu("Could not load from the link (" + errText(e) + "). The server must allow CORS.");
    });
  }
  function openPicker() {
    pickInput.value = "";
    pickInput.click();
  }
  pickInput.addEventListener("change", function () {
    var file = pickInput.files && pickInput.files[0];
    if (!file) return;
    if (!isVxpName(file.name)) {
      showMenu("Only .vxp files can be opened (selected: " + file.name + ").");
      return;
    }
    showStatus("Reading " + file.name + "...", false);
    var reader = new FileReader();
    reader.onload = function () { startEngine(reader.result); };
    reader.onerror = function () { showMenu("Could not read the file " + file.name + "."); };
    reader.readAsArrayBuffer(file);
  });

  var vxpUrl = getParam("vxp");
  if (vxpUrl) {
    loadLinkGame();
  } else {
    showMenu("");
  }

  // ---------- SD card scanner (DeviceStorage; needs a privileged app) ----------

  function baseName(name) {
    return String(name || "").split("/").pop();
  }
  function renderScan() {
    scanListEl.innerHTML = "";
    for (var i = 0; i < scanFiles.length; i++) {
      var li = document.createElement("li");
      li.textContent = (i + 1) + ". " + baseName(scanFiles[i].name);
      if (i === scanIndex) li.className = "sel";
      scanListEl.appendChild(li);
    }
    scrollScanIntoView();
  }
  // Keeps the selected row visible, scrolling up or down.
  function scrollScanIntoView() {
    var item = scanListEl.children[scanIndex];
    if (!item) return;
    var top = item.offsetTop, bottom = top + item.offsetHeight;
    if (top < scanListEl.scrollTop) scanListEl.scrollTop = top;
    else if (bottom > scanListEl.scrollTop + scanListEl.clientHeight) scanListEl.scrollTop = bottom - scanListEl.clientHeight;
  }
  function moveScan(step) {
    if (!scanFiles.length) return;
    scanIndex = (scanIndex + step + scanFiles.length) % scanFiles.length;
    var items = scanListEl.children;
    for (var i = 0; i < items.length; i++) items[i].className = (i === scanIndex) ? "sel" : "";
    scrollScanIntoView();
  }
  function showScanner(title) {
    menuVisible = false;
    menuBox.className = "";
    scanVisible = true;
    scannerBox.className = "show";
    scanHeaderEl.textContent = title;
  }
  function scanSdcard() {
    if (!navigator.getDeviceStorages) {
      showMenu("Scanning needs a privileged install. Use 'Open .vxp from phone' instead.");
      return;
    }
    var stores = [];
    try { stores = navigator.getDeviceStorages("sdcard") || []; } catch (e) { stores = []; }
    if (!stores.length) {
      showMenu("No SD card found.");
      return;
    }
    scanFiles = [];
    scanIndex = 0;
    showScanner("Scanning SD card...");
    scanListEl.innerHTML = "";
    var pending = stores.length;
    function done() {
      pending--;
      if (pending > 0) return;
      scanFiles.sort(function (a, b) { return baseName(a.name).toLowerCase() < baseName(b.name).toLowerCase() ? -1 : 1; });
      if (!scanFiles.length) {
        showMenu("No .vxp files found on the SD card.");
        return;
      }
      showScanner(scanFiles.length + " .vxp file(s) found");
      renderScan();
    }
    for (var i = 0; i < stores.length; i++) {
      (function (store) {
        var cursor = null;
        try { cursor = store.enumerate(); } catch (e) { cursor = null; }
        if (!cursor) { done(); return; }
        cursor.onsuccess = function () {
          var r = cursor.result;
          if (r) {
            if (isVxpName(r.name)) scanFiles.push(r);
            cursor.continue();
          } else {
            done();
          }
        };
        cursor.onerror = function () { done(); };
      })(stores[i]);
    }
  }
  function playScanned() {
    var file = scanFiles[scanIndex];
    if (!file) return;
    showStatus("Reading " + baseName(file.name) + "...", false);
    var reader = new FileReader();
    reader.onload = function () { startEngine(reader.result); };
    reader.onerror = function () { showMenu("Could not read " + baseName(file.name) + "."); };
    reader.readAsArrayBuffer(file);
  }
  function handleScanKey(name) {
    if (name === "up") moveScan(-1);
    else if (name === "down") moveScan(1);
    else if (name === "ok") playScanned();
    else if (name === "soft-right" || name === "end") showMenu("");
  }

  // ---------- keys ----------
  var KEY_CODES = {
    "up": -1, "down": -2, "left": -3, "right": -4, "ok": -5,
    "soft-left": -6, "soft-right": -7, "end": -9, "*": 42, "#": 35
  };
  var KEY_NAMES = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok",
    SoftLeft: "soft-left", SoftRight: "soft-right", F1: "soft-left", F2: "soft-right",
    Backspace: "soft-right", EndCall: "end", Escape: "end", Call: "soft-left", "*": "*", "#": "#"
  };
  for (var n = 0; n <= 9; n++) {
    KEY_NAMES[String(n)] = String(n);
    KEY_CODES[String(n)] = 48 + n;
  }
  function sendKey(ev, code) {
    if (worker) worker.postMessage({ type: "key", ev: ev, code: code });
  }
  document.addEventListener("keydown", function (e) {
    var name = KEY_NAMES[e.key];
    if (scanVisible) {
      handleScanKey(name);
      if (name) e.preventDefault();
      return;
    }
    if (menuVisible) {
      if (name === "up") moveMenu(-1);
      else if (name === "down") moveMenu(1);
      else if (name === "ok") activateMenu();
      if (name) e.preventDefault();
      return;
    }
    synth.ensure();
    if (synth.ctx && synth.ctx.resume) synth.ctx.resume();
    if (name) { e.preventDefault(); if (!e.repeat) sendKey(2, KEY_CODES[name]); }
  });
  document.addEventListener("keyup", function (e) {
    var name = KEY_NAMES[e.key];
    if (scanVisible || menuVisible) { if (name) e.preventDefault(); return; }
    if (name) { e.preventDefault(); sendKey(1, KEY_CODES[name]); }
  });
  document.addEventListener("visibilitychange", function () {
    if (worker) worker.postMessage({ type: "running", value: !document.hidden });
    if (document.hidden) midi.pause(); else midi.resume();
  });
})();
</script>
</body>
</html>
